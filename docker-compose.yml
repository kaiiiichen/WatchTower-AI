services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
